title: Fleet / Views / Host
uid: fleet-host
tags: [Fleet, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Storage
    url: /d/fleet-views-storage
    type: link
    icon: dashboard
templating:
  list:
    - name: host
      label: Host
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(up, host)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
panels:
  - id: 1
    type: row
    title: Quick
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 0 }
    panels: []
  - id: 2
    type: gauge
    title: CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 0, y: 1 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 85 }
            - { color: red, value: 95 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle",host="$host"}[$__rate_interval])))
  - id: 3
    type: gauge
    title: RAM
    description: Excludes reclaimable ZFS ARC, which the kernel does not count as available.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 4, y: 1 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: clamp_min((1 - node:memory_available_with_arc_bytes{host="$host"} / node_memory_MemTotal_bytes{host="$host"}) * 100, 0)
  - id: 4
    type: gauge
    title: Swap
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 8, y: 1 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 10 }
            - { color: red, value: 25 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: (node_memory_SwapTotal_bytes{host="$host"} - node_memory_SwapFree_bytes{host="$host"}) / clamp_min(node_memory_SwapTotal_bytes{host="$host"}, 1) * 100
  - id: 5
    type: gauge
    title: Worst filesystem
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 12, y: 1 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: max(100 * (1 - node_filesystem_avail_bytes{host="$host",fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / node_filesystem_size_bytes{host="$host",fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"}))
  - id: 6
    type: gauge
    title: Load per core
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 16, y: 1 }
    fieldConfig:
      defaults:
        unit: none
        min: 0
        max: 2
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 0.7 }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: node_load5{host="$host"} / scalar(count(node_cpu_seconds_total{mode="idle",host="$host"}))
  - id: 7
    type: gauge
    title: I/O wait
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 7, w: 4, x: 20, y: 1 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        max: 0.3
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: dark-green, value: null }
            - { color: orange, value: 0.1 }
            - { color: red, value: 0.2 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdMarkers: true
      showThresholdLabels: false
    targets:
      - refId: A
        instant: true
        expr: avg(rate(node_cpu_seconds_total{mode="iowait",host="$host"}[$__rate_interval]))
  - id: 8
    type: stat
    title: Cores
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 0, y: 8 }
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(count by (cpu) (node_cpu_seconds_total{mode="idle",host="$host"}))
  - id: 9
    type: stat
    title: RAM total
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 4, x: 3, y: 8 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: node_memory_MemTotal_bytes{host="$host"}
  - id: 10
    type: stat
    title: Swap total
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 7, y: 8 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: node_memory_SwapTotal_bytes{host="$host"}
  - id: 11
    type: stat
    title: Uptime
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 10, y: 8 }
    fieldConfig:
      defaults:
        unit: dtdurations
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: time() - node_boot_time_seconds{host="$host"}
  - id: 12
    type: stat
    title: Reboots
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 2, x: 13, y: 8 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: changes(node_boot_time_seconds{host="$host"}[24h])
  - id: 13
    type: stat
    title: Running
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 15, y: 8 }
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: node_procs_running{host="$host"}
  - id: 14
    type: stat
    title: Resident
    description: Process memory that cannot be reclaimed (anonymous pages and tmpfs).
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 18, y: 8 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: node_memory_AnonPages_bytes{host="$host"} + node_memory_Shmem_bytes{host="$host"}
  - id: 105
    type: stat
    title: Steal
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 3, w: 3, x: 21, y: 8 }
    fieldConfig:
      defaults:
        unit: percent
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 2 }
            - { color: red, value: 5 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: 100 * avg(rate(node_cpu_seconds_total{mode="steal",host="$host"}[$__rate_interval]))
  - id: 15
    type: row
    title: CPU
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 16
    type: timeseries
    title: CPU modes
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        max: 1
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 48
          gradientMode: opacity
          showPoints: never
          stacking: { group: A, mode: normal }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: avg by (mode) (rate(node_cpu_seconds_total{host="$host"}[$__rate_interval]))
        legendFormat: "{{mode}}"
  - id: 17
    type: timeseries
    title: CPU per core
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 1
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: table, placement: bottom, showLegend: true, calcs: [mean, max] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg by (cpu) (rate(node_cpu_seconds_total{mode="idle",host="$host"}[$__rate_interval])))
        legendFormat: "cpu{{cpu}}"
  - id: 18
    type: timeseries
    title: CPU non-idle modes
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 20 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * avg by (mode) (rate(node_cpu_seconds_total{host="$host",mode=~"user|system|iowait|irq|softirq|steal|nice"}[$__rate_interval]))
  - id: 19
    type: timeseries
    title: CPU pressure
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 20 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(node_pressure_cpu_waiting_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: waiting
  - id: 20
    type: timeseries
    title: Context switches and interrupts
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 28 }
    fieldConfig:
      defaults:
        unit: ops
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(node_context_switches_total{host="$host"}[$__rate_interval])
        legendFormat: context switches
      - refId: B
        expr: rate(node_intr_total{host="$host"}[$__rate_interval])
        legendFormat: interrupts
  - id: 21
    type: timeseries
    title: CPU frequency
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 28 }
    fieldConfig:
      defaults:
        unit: hertz
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 1
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: table, placement: bottom, showLegend: true, calcs: [mean, max] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_cpu_scaling_frequency_hertz{host="$host"}
        legendFormat: "cpu{{cpu}}"
  - id: 106
    type: timeseries
    title: CPU steal
    description: Time the hypervisor gave to other guests instead of this one.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 36 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        decimals: 2
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
          thresholdsStyle: { mode: dashed }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 2 }
            - { color: red, value: 5 }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * avg(rate(node_cpu_seconds_total{mode="steal",host="$host"}[$__rate_interval]))
        legendFormat: total
  - id: 107
    type: timeseries
    title: CPU steal per core
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 36 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        decimals: 2
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: table, placement: bottom, showLegend: true, calcs: [mean, max] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * rate(node_cpu_seconds_total{mode="steal",host="$host"}[$__rate_interval])
        legendFormat: "cpu{{cpu}}"
  - id: 22
    type: row
    title: Memory
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 44 }
    panels: []
  - id: 23
    type: timeseries
    title: Memory
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 12, x: 0, y: 45 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_memory_MemTotal_bytes{host="$host"}
        legendFormat: Total
      - refId: B
        expr: clamp_min((node_memory_MemTotal_bytes{host="$host"} - node_memory_MemFree_bytes{host="$host"} - (node_memory_Cached_bytes{host="$host"} + node_memory_Buffers_bytes{host="$host"} + node_memory_SReclaimable_bytes{host="$host"}) - node_zfs_arc_size{host="$host"}) or (node_memory_MemTotal_bytes{host="$host"} - node_memory_MemFree_bytes{host="$host"} - (node_memory_Cached_bytes{host="$host"} + node_memory_Buffers_bytes{host="$host"} + node_memory_SReclaimable_bytes{host="$host"})), 0)
        legendFormat: Used by apps
      - refId: C
        expr: node_memory_Cached_bytes{host="$host"} + node_memory_Buffers_bytes{host="$host"} + node_memory_SReclaimable_bytes{host="$host"}
        legendFormat: Cache + Buffer
      - refId: D
        expr: node_memory_MemFree_bytes{host="$host"}
        legendFormat: Free
      - refId: E
        expr: node_zfs_arc_size{host="$host"}
        legendFormat: ZFS ARC
      - refId: F
        expr: node_memory_AnonPages_bytes{host="$host"} + node_memory_Shmem_bytes{host="$host"}
        legendFormat: Resident
      - refId: G
        expr: node_memory_SUnreclaim_bytes{host="$host"}
        legendFormat: Kernel slab (unreclaimable)
  - id: 24
    type: timeseries
    title: Swap
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 12, x: 12, y: 45 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_memory_SwapTotal_bytes{host="$host"}
        legendFormat: Total
      - refId: B
        expr: node_memory_SwapTotal_bytes{host="$host"} - node_memory_SwapFree_bytes{host="$host"}
        legendFormat: Used
  - id: 25
    type: timeseries
    title: Commit
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 54 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_memory_Committed_AS_bytes{host="$host"}
        legendFormat: Committed
      - refId: B
        expr: node_memory_CommitLimit_bytes{host="$host"}
        legendFormat: Commit limit
  - id: 26
    type: timeseries
    title: Dirty and writeback
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 54 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_memory_Dirty_bytes{host="$host"}
        legendFormat: Dirty
      - refId: B
        expr: node_memory_Writeback_bytes{host="$host"}
        legendFormat: Writeback
      - refId: C
        expr: node_memory_WritebackTmp_bytes{host="$host"}
        legendFormat: Writeback tmp
  - id: 27
    type: timeseries
    title: Memory pressure
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 62 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(node_pressure_memory_waiting_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: waiting
      - refId: B
        expr: rate(node_pressure_memory_stalled_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: stalled
  - id: 28
    type: stat
    title: OOM kills (24h)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 62 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(increase(node_vmstat_oom_kill{host="$host"}[24h])) or vector(0)
  - id: 108
    type: timeseries
    title: ZFS ARC size
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 70 }
