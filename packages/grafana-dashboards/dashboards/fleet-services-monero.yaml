title: Fleet / Services / Monero
uid: fleet-services-monero
tags: [Fleet, Monero, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
  - title: Storage
    url: /d/fleet-views-storage
    type: link
    icon: dashboard
templating:
  list:
    - name: host
      label: Host
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(up{service="monero"}, host)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
    - name: dataset
      label: Dataset
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(zfs_dataset_used_bytes{host="$host",name=~".*/monero"}, name)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
panels:
  - id: 1
    type: stat
    title: Chain
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "1": { text: synced, index: 0 }
              "0": { text: syncing, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: orange, value: null }
            - { color: green, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_synchronized{host="$host"}
  - id: 2
    type: stat
    title: Height
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_height{host="$host"}
  - id: 3
    type: stat
    title: TX pool
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 8, y: 0 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_tx_pool_size{host="$host"}
  - id: 4
    type: stat
    title: Database
    description: Reported by monerod, which is larger than the dataset because of logs and indexes.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 12, y: 0 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_database_size{host="$host"}
  - id: 5
    type: stat
    title: Dataset
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 16, y: 0 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"}
  - id: 6
    type: stat
    title: Daemon
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 20, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "0": { text: online, index: 0 }
              "1": { text: offline, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_offline{host="$host"}
  - id: 7
    type: stat
    title: Incoming peers
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 6 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_incoming_connections_count{host="$host"}
  - id: 8
    type: stat
    title: Outgoing peers
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 6 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_outgoing_connections_count{host="$host"}
  - id: 9
    type: stat
    title: Network hashrate
    description: Difficulty divided by the target block time; the 1h rate of cumulative difficulty is what the chain actually produced.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 6 }
    fieldConfig:
      defaults:
        unit: Hs
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: monero_difficulty{host="$host"} / monero_target{host="$host"}
  - id: 10
    type: stat
    title: Dataset free
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 6 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: zfs_dataset_available_bytes{host="$host",name="$dataset"}
  - id: 11
    type: row
    title: Chain
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: timeseries
    title: Height
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_height{host="$host"}
        legendFormat: height
  - id: 13
    type: timeseries
    title: Network hashrate
    description: Difficulty divided by the target block time, plus the hashrate the chain actually produced over a rolling hour.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: Hs
        min: 0
        decimals: 2
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_difficulty{host="$host"} / monero_target{host="$host"}
        legendFormat: difficulty / target
      - refId: B
        expr: rate(monero_cumulative_difficulty{host="$host"}[1h])
        legendFormat: chain rate (1h)
  - id: 14
    type: timeseries
    title: Transactions
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 20 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_tx_count{host="$host"}
        legendFormat: chain transactions
  - id: 15
    type: timeseries
    title: TX pool
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 20 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_tx_pool_size{host="$host"}
        legendFormat: transactions
  - id: 16
    type: timeseries
    title: Database and dataset
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 28 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_database_size{host="$host"}
        legendFormat: database
      - refId: B
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"}
        legendFormat: dataset used
      - refId: C
        expr: zfs_dataset_available_bytes{host="$host",name="$dataset"}
        legendFormat: dataset available
  - id: 17
    type: timeseries
    title: Block weight
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 28 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_block_weight_median{host="$host"}
        legendFormat: median
      - refId: B
        expr: monero_block_weight_limit{host="$host"}
        legendFormat: limit
  - id: 18
    type: row
    title: Network
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 36 }
    panels: []
  - id: 19
    type: timeseries
    title: Host throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 37 }
    fieldConfig:
      defaults:
        unit: bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 8 * sum(rate(node_network_receive_bytes_total{host="$host",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: rx
      - refId: B
        expr: 8 * sum(rate(node_network_transmit_bytes_total{host="$host",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: tx
  - id: 20
    type: timeseries
    title: Peers
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 37 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_incoming_connections_count{host="$host"}
        legendFormat: incoming
      - refId: B
        expr: monero_outgoing_connections_count{host="$host"}
        legendFormat: outgoing
      - refId: C
        expr: monero_rpc_connections_count{host="$host"}
        legendFormat: rpc
  - id: 21
    type: timeseries
    title: Peerlist
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 45 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: monero_grey_peerlist_size{host="$host"}
        legendFormat: grey
      - refId: B
        expr: monero_white_peerlist_size{host="$host"}
        legendFormat: white
  - id: 22
    type: timeseries
    title: Scrape duration
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 45 }
    fieldConfig:
      defaults:
        unit: s
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: scrape_duration_seconds{service="monero",host="$host"}
        legendFormat: scrape
  - id: 23
    type: row
    title: Host
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 53 }
    panels: []
  - id: 24
    type: timeseries
    title: CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 54 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{host="$host",mode="idle"}[$__rate_interval])))
        legendFormat: host CPU
  - id: 25
    type: timeseries
    title: Memory used (apps)
    description: Excludes reclaimable ZFS ARC.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 54 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - node:memory_available_with_arc_bytes{host="$host"} / node_memory_MemTotal_bytes{host="$host"})
        legendFormat: memory
  - id: 26
    type: timeseries
    title: Load per core
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 62 }
    fieldConfig:
      defaults:
        unit: none
        min: 0
        decimals: 2
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: node_load5{host="$host"} / scalar(count(node_cpu_seconds_total{host="$host",mode="idle"}))
        legendFormat: load
  - id: 27
    type: timeseries
    title: Disk throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 62 }
    fieldConfig:
      defaults:
        unit: Bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(node_disk_written_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: written
      - refId: B
        expr: sum(rate(node_disk_read_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: read
  - id: 28
    type: timeseries
    title: Pressure
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 70 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(node_pressure_io_waiting_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: io waiting
      - refId: B
        expr: rate(node_pressure_io_stalled_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: io stalled
      - refId: C
        expr: rate(node_pressure_memory_waiting_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: memory waiting
      - refId: D
        expr: rate(node_pressure_cpu_waiting_seconds_total{host="$host"}[$__rate_interval])
        legendFormat: cpu waiting
  - id: 29
    type: timeseries
    title: Disk IOPS
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 70 }
    fieldConfig:
      defaults:
        unit: iops
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(node_disk_writes_completed_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: writes
      - refId: B
        expr: sum(rate(node_disk_reads_completed_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: reads
  - id: 30
    type: row
    title: Storage
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 78 }
    panels: []
  - id: 31
    type: timeseries
    title: Dataset usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 79 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"}
        legendFormat: used
      - refId: B
        expr: zfs_dataset_referenced_bytes{host="$host",name="$dataset"}
        legendFormat: referenced
      - refId: C
        expr: zfs_dataset_available_bytes{host="$host",name="$dataset"}
        legendFormat: available
  - id: 32
    type: timeseries
    title: Dataset growth (per day)
    description: Slope over the last 6h, extrapolated to a day.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 79 }
    fieldConfig:
      defaults:
        unit: bytes
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: deriv(zfs_dataset_used_bytes{host="$host",name="$dataset"}[6h]) * 86400
        legendFormat: growth
  - id: 33
    type: stat
    title: Compression
    description: Physical used divided by logical used; below 1 means ZFS is compressing the dataset.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 8, x: 0, y: 87 }
    fieldConfig:
      defaults:
        unit: ratio
        decimals: 2
        thresholds:
