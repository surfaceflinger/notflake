title: Fleet / Views / Overview
uid: fleet-overview
tags: [Fleet, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
  - title: Storage
    url: /d/fleet-views-storage
    type: link
    icon: dashboard
panels:
  - id: 1
    type: stat
    title: Hosts up
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: count(up{job=~"node.*"} == 1)
  - id: 2
    type: stat
    title: Hosts down
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: count(up{job=~"node.*"} == 0) or vector(0)
  - id: 3
    type: stat
    title: Reboots (24h)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 3, x: 8, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: sum(changes(node_boot_time_seconds{role!="vacuum"}[24h]))
  - id: 4
    type: gauge
    title: CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 3, x: 11, y: 0 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        max: 1
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.7 }
            - { color: red, value: 0.9 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdLabels: false
      showThresholdMarkers: true
      orientation: auto
      sizing: auto
    targets:
      - refId: A
        instant: true
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[$__rate_interval]))
  - id: 5
    type: gauge
    title: Memory
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 3, x: 14, y: 0 }
    fieldConfig:
      defaults:
        unit: percentunit
        min: 0
        max: 1
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.7 }
            - { color: red, value: 0.9 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdLabels: false
      showThresholdMarkers: true
      orientation: auto
      sizing: auto
    targets:
      - refId: A
        instant: true
        expr: 1 - sum(node:memory_available_with_arc_bytes) / sum(node_memory_MemTotal_bytes)
  - id: 6
    type: gauge
    title: Fullest filesystem
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 3, x: 17, y: 0 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdLabels: false
      showThresholdMarkers: true
      orientation: auto
      sizing: auto
    targets:
      - refId: A
        instant: true
        expr: max(100 * (1 - node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / node_filesystem_size_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"}))
  - id: 110
    type: stat
    title: Resident
    description: Process memory that cannot be reclaimed (anonymous pages and tmpfs).
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 20, y: 0 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: sum(node_memory_AnonPages_bytes + node_memory_Shmem_bytes)
  - id: 7
    type: stat
    title: ZFS pools not online
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: count(zfs_pool_health != 0) or vector(0)
  - id: 8
    type: stat
    title: SMART failing
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: count(smartctl_device_smart_status != 1) or vector(0)
  - id: 9
    type: gauge
    title: Shortest filesystem runway
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 6 }
    fieldConfig:
      defaults:
        unit: d
        min: 0
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: orange, value: 30 }
            - { color: green, value: 180 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      showThresholdLabels: false
      showThresholdMarkers: true
      orientation: auto
      sizing: auto
    targets:
      - refId: A
        instant: true
        expr: min((node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / (-1 * (node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} - (node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} offset 24h)))) / 86400 > 0)
  - id: 10
    type: stat
    title: Targets down
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
      justifyMode: auto
      orientation: auto
    targets:
      - refId: A
        instant: true
        expr: count(up == 0) or vector(0)
  - id: 11
    type: row
    title: Hosts
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: bargauge
    title: CPU usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 70 }
            - { color: red, value: 90 }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{host!="",mode="idle"}[$__rate_interval])))
        legendFormat: "{{host}}"
  - id: 13
    type: bargauge
    title: Memory used (apps)
    description: Excludes reclaimable ZFS ARC, which the kernel does not count as available.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 4, y: 12 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 70 }
            - { color: red, value: 90 }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: 100 * (1 - sum by (host) (node:memory_available_with_arc_bytes{host!=""}) / sum by (host) (node_memory_MemTotal_bytes{host!=""}))
        legendFormat: "{{host}}"
  - id: 101
    type: bargauge
    title: ZFS ARC
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 8, y: 12 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: value
    targets:
      - refId: A
        instant: true
        expr: sum by (host) (node_zfs_arc_size{host!=""})
        legendFormat: "{{host}}"
  - id: 14
    type: bargauge
    title: Worst filesystem
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: max by (host) (100 * (1 - node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / node_filesystem_size_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"}))
        legendFormat: "{{host}}"
  - id: 15
    type: bargauge
    title: Load per core
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 16, y: 12 }
    fieldConfig:
      defaults:
        unit: none
        min: 0
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.7 }
            - { color: red, value: 1 }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: max by (host) (node_load5) / count by (host) (node_cpu_seconds_total{mode="idle"})
        legendFormat: "{{host}}"
  - id: 102
    type: bargauge
    title: CPU steal
    description: Time the hypervisor gave to other guests instead of this one.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 4, x: 20, y: 12 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 25
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 2 }
            - { color: red, value: 5 }
        links:
          - title: "Open ${__field.labels.host}"
            url: /d/fleet-views-host?var-host=${__field.labels.host}
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: 100 * avg by (host) (rate(node_cpu_seconds_total{host!="",mode="steal"}[$__rate_interval]))
        legendFormat: "{{host}}"
  - id: 16
    type: row
    title: Trends
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 21 }
    panels: []
  - id: 17
    type: timeseries
    title: CPU usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 22 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: off }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{host!="",mode="idle"}[$__rate_interval])))
        legendFormat: "{{host}}"
  - id: 18
    type: timeseries
    title: Memory used
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 22 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: off }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - sum by (host) (node:memory_available_with_arc_bytes{host!=""}) / sum by (host) (node_memory_MemTotal_bytes{host!=""}))
        legendFormat: "{{host}}"
  - id: 19
    type: timeseries
    title: Network throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 30 }
    fieldConfig:
      defaults:
        unit: bps
        min: 0
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: off }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 8 * sum by (host) (rate(node_network_transmit_bytes_total{host!="",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: "Tx {{host}}"
      - refId: B
        expr: 8 * sum by (host) (rate(node_network_receive_bytes_total{host!="",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: "Rx {{host}}"
  - id: 20
    type: timeseries
    title: Disk throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 30 }
    fieldConfig:
      defaults:
        unit: Bps
        min: 0
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: off }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (host) (rate(node_disk_written_bytes_total{host!="",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: "Written {{host}}"
      - refId: B
        expr: sum by (host) (rate(node_disk_read_bytes_total{host!="",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: "Read {{host}}"
  - id: 103
    type: timeseries
    title: CPU steal
    description: Time the hypervisor gave to other guests instead of this one.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 38 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        decimals: 2
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: dashed }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 2 }
            - { color: red, value: 5 }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * avg by (host) (rate(node_cpu_seconds_total{host!="",mode="steal"}[$__rate_interval]))
        legendFormat: "{{host}}"
  - id: 104
    type: timeseries
    title: ZFS ARC
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 38 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        color: { mode: palette-classic }
        custom:
          axisPlacement: auto
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
          spanNulls: false
          stacking: { group: A, mode: none }
          thresholdsStyle: { mode: off }
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (host) (node_zfs_arc_size{host!=""})
        legendFormat: "{{host}}"
  - id: 21
    type: row
    title: Capacity
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 54 }
    panels: []
  - id: 22
    type: bargauge
    title: Fullest mountpoints
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 55 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: topk(8, 100 * (1 - node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / node_filesystem_size_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"}))
        legendFormat: "{{host}} {{mountpoint}}"
  - id: 23
    type: table
    title: Filesystems filling within 10 years (days left)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 55 }
    fieldConfig:
      defaults:
        unit: d
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: orange, value: 30 }
            - { color: green, value: 180 }
      overrides: []
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            __name__: true
            device: true
            fstype: true
            instance: true
            job: true
          renameByName:
            Value: days
            host: host
            mountpoint: mountpoint
      - id: sortBy
        options:
          sort:
            - { field: days, desc: false }
    targets:
      - refId: A
        instant: true
        format: table
        expr: (node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} / (-1 * (node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} - (node_filesystem_avail_bytes{fstype=~"zfs|ext4|btrfs",mountpoint!="/boot"} offset 24h)))) / 86400 > 0
  - id: 24
    type: bargauge
    title: ZFS pool usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 63 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 80 }
            - { color: red, value: 90 }
        links:
          - title: "Open storage"
            url: /d/fleet-views-storage
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: 100 * zfs_pool_allocated_bytes / zfs_pool_size_bytes
        legendFormat: "{{host}} {{pool}}"
  - id: 25
    type: bargauge
    title: Hottest drives
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 63 }
    fieldConfig:
      defaults:
        unit: celsius
        min: 0
        max: 80
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 45 }
            - { color: red, value: 55 }
        links:
          - title: "Open storage"
            url: /d/fleet-views-storage
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      valueMode: color
    targets:
      - refId: A
        instant: true
        expr: smartctl_device_temperature{temperature_type="current"}
        legendFormat: "{{host}} {{device}}"
  - id: 26
    type: row
    title: Services
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 71 }
    panels: []
  - id: 27
    type: table
    title: Scrape targets
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 24, x: 0, y: 72 }
    fieldConfig:
      defaults:
        unit: none
        color: { mode: thresholds }
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: green, value: 1 }
        mappings:
          - type: value
            options:
              "1": { text: up, index: 0 }
              "0": { text: down, index: 1 }
      overrides: []
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            __name__: true
            instance: true
          renameByName:
            Value: state
      - id: sortBy
        options:
          sort:
            - { field: job, desc: false }
    targets:
      - refId: A
        instant: true
        format: table
        expr: up
