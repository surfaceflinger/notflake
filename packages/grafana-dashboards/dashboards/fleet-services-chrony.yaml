title: Fleet / Services / Chrony
uid: fleet-services-chrony
tags: [Fleet, Time, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
panels:
  - id: 1
    type: stat
    title: Worst offset
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: ms
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 1 }
            - { color: red, value: 10 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: max(abs(chrony_tracking_last_offset_seconds{host!=""})) * 1000
  - id: 2
    type: stat
    title: Worst RMS offset
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
