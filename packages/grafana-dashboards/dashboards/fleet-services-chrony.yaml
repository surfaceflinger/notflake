  - id: 11
    type: row
    title: Hosts
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: table
    title: Hosts (now)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 9, w: 24, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides:
        - matcher: { id: byName, options: "offset ms" }
          properties:
            - id: unit
              value: ms
        - matcher: { id: byName, options: "rms ms" }
          properties:
            - id: unit
              value: ms
        - matcher: { id: byName, options: "root delay ms" }
          properties:
            - id: unit
              value: ms
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            __name__: true
      - id: merge
        options: {}
      - id: organize
        options:
          excludeByName:
            Time: true
            instance: true
            job: true
          renameByName:
            "Value #A": offset ms
            "Value #B": rms ms
            "Value #C": skew ppm
            "Value #D": freq ppm
            "Value #E": stratum
            "Value #F": root delay ms
      - id: sortBy
        options:
          sort:
            - { field: "offset ms", desc: true }
    targets:
      - refId: A
        instant: true
        format: table
        expr: chrony_tracking_last_offset_seconds{host!=""} * 1000
      - refId: B
        instant: true
        format: table
        expr: chrony_tracking_rms_offset_seconds{host!=""} * 1000
      - refId: C
        instant: true
        format: table
        expr: chrony_tracking_skew_ppms{host!=""}
      - refId: D
        instant: true
        format: table
        expr: chrony_tracking_frequency_ppms{host!=""}
      - refId: E
        instant: true
        format: table
        expr: chrony_tracking_stratum{host!=""}
      - refId: F
        instant: true
        format: table
        expr: chrony_tracking_root_delay_seconds{host!=""} * 1000
  - id: 13
    type: row
    title: Offsets
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 21 }
    panels: []
