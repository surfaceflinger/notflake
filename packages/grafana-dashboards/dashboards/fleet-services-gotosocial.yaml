title: Fleet / Services / GoToSocial
uid: fleet-services-gotosocial
tags: [Fleet, GoToSocial, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
  - title: Storage
    url: /d/fleet-views-storage
    type: link
    icon: dashboard
templating:
  list:
    - name: host
      label: Host
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(up{service="gotosocial"}, host)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
    - name: dataset
      label: Dataset
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(zfs_dataset_used_bytes{host="$host",name=~".*/gotosocial"}, name)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
panels:
  - id: 1
    type: stat
    title: Users
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: gotosocial_instance_total_users{host="$host"}
  - id: 2
    type: stat
    title: Statuses
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: gotosocial_instance_total_statuses{host="$host"}
  - id: 3
    type: stat
    title: Federating instances
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 8, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: gotosocial_instance_total_federating_instances{host="$host"}
  - id: 4
    type: stat
    title: Requests
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 12, y: 0 }
    fieldConfig:
      defaults:
        unit: reqps
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(http_server_requests_total{host="$host"}[$__rate_interval]))
  - id: 5
    type: stat
    title: Active requests
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 16, y: 0 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(http_server_requests_active{host="$host"})
  - id: 6
    type: stat
    title: Queued tasks
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 20, y: 0 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 100 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum({__name__=~"gotosocial_workers_.*_queue",host="$host"})
  - id: 7
    type: stat
    title: Process RSS
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 6 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: process_resident_memory_bytes{job="gotosocial",host="$host"}
  - id: 8
    type: stat
    title: Process CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 6 }
    fieldConfig:
      defaults:
        unit: percent
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: rate(process_cpu_seconds_total{job="gotosocial",host="$host"}[$__rate_interval]) * 100
  - id: 9
    type: stat
    title: Goroutines
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: go_goroutines{job="gotosocial",host="$host"}
  - id: 10
    type: stat
    title: Dataset free
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 6 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: zfs_dataset_available_bytes{host="$host",name="$dataset"}
  - id: 11
    type: row
    title: Workers
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: timeseries
    title: Worker counts
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (worker) (label_replace({__name__=~"gotosocial_workers_.*_count",host="$host"}, "worker", "$1", "__name__", "gotosocial_workers_(.*)_count"))
        legendFormat: "{{worker}}"
  - id: 13
    type: timeseries
    title: Worker queues
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (worker) (label_replace({__name__=~"gotosocial_workers_.*_queue",host="$host"}, "worker", "$1", "__name__", "gotosocial_workers_(.*)_queue"))
        legendFormat: "{{worker}}"
  - id: 14
    type: row
    title: HTTP
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 20 }
    panels: []
  - id: 15
    type: timeseries
    title: Requests by status
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 21 }
    fieldConfig:
      defaults:
        unit: reqps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (http_status_code) (rate(http_server_requests_total{host="$host"}[$__rate_interval]))
        legendFormat: "{{http_status_code}}"
  - id: 16
    type: timeseries
    title: Requests by group
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 21 }
    fieldConfig:
      defaults:
        unit: reqps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(http_server_requests_total{host="$host",http_route=~"/api/.+"}[$__rate_interval]))
        legendFormat: client api
      - refId: B
        expr: sum(rate(http_server_requests_total{host="$host",http_route=~"/(.well-known|users).+"}[$__rate_interval]))
        legendFormat: federation
      - refId: C
        expr: sum(rate(http_server_requests_total{host="$host",http_route=~"/fileserver/.+"}[$__rate_interval]))
        legendFormat: fileserver
  - id: 17
    type: timeseries
    title: Latency
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 29 }
    fieldConfig:
      defaults:
        unit: ms
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_duration_milliseconds_bucket{host="$host"}[$__rate_interval])))
        legendFormat: p95
      - refId: B
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_duration_milliseconds_bucket{host="$host"}[$__rate_interval])))
        legendFormat: p99
  - id: 18
    type: timeseries
    title: Response size
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 29 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(http_server_response_size_bytes_sum{host="$host"}[$__rate_interval])) / sum(rate(http_server_response_size_bytes_count{host="$host"}[$__rate_interval]))
        legendFormat: average response
      - refId: B
        expr: sum(rate(http_server_request_size_bytes_sum{host="$host"}[$__rate_interval])) / sum(rate(http_server_request_size_bytes_count{host="$host"}[$__rate_interval]))
        legendFormat: average request
  - id: 19
    type: row
    title: Runtime
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 37 }
    panels: []
  - id: 20
    type: timeseries
    title: Memory
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 38 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: go_memstats_heap_inuse_bytes{job="gotosocial",host="$host"}
        legendFormat: heap in use
      - refId: B
        expr: go_memstats_stack_inuse_bytes{job="gotosocial",host="$host"}
        legendFormat: stack
      - refId: C
        expr: go_memstats_gc_sys_bytes{job="gotosocial",host="$host"}
        legendFormat: gc sys
      - refId: D
        expr: go_memstats_sys_bytes{job="gotosocial",host="$host"}
        legendFormat: sys
  - id: 21
    type: timeseries
    title: Heap objects
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 38 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: go_memstats_heap_objects{job="gotosocial",host="$host"}
        legendFormat: live objects
      - refId: B
        expr: go_memstats_mallocs_total{job="gotosocial",host="$host"} - go_memstats_frees_total{job="gotosocial",host="$host"}
        legendFormat: allocated - freed
  - id: 22
    type: timeseries
    title: Allocation rate
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 46 }
    fieldConfig:
      defaults:
        unit: Bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(go_memstats_alloc_bytes_total{job="gotosocial",host="$host"}[$__rate_interval])
        legendFormat: allocated
  - id: 23
    type: timeseries
    title: GC pause
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 46 }
    fieldConfig:
      defaults:
        unit: s
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: rate(go_gc_duration_seconds_sum{job="gotosocial",host="$host"}[$__rate_interval]) / rate(go_gc_duration_seconds_count{job="gotosocial",host="$host"}[$__rate_interval])
        legendFormat: average pause
  - id: 24
    type: timeseries
    title: SQL pool
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 54 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: go_sql_connections_open{job="gotosocial",host="$host"}
        legendFormat: open
      - refId: B
        expr: go_sql_connections_in_use{job="gotosocial",host="$host"}
        legendFormat: in use
      - refId: C
        expr: go_sql_connections_idle{job="gotosocial",host="$host"}
        legendFormat: idle
      - refId: D
        expr: go_sql_connections_max_open{job="gotosocial",host="$host"}
        legendFormat: max open
  - id: 25
    type: timeseries
    title: Query timing
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 54 }
    fieldConfig:
      defaults:
        unit: ms
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(go_sql_query_timing_milliseconds_sum{job="gotosocial",host="$host"}[$__rate_interval])) / sum(rate(go_sql_query_timing_milliseconds_count{job="gotosocial",host="$host"}[$__rate_interval]))
        legendFormat: average query
  - id: 26
    type: row
    title: Host
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 62 }
    panels: []
  - id: 27
    type: timeseries
    title: Host CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 63 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{host="$host",mode="idle"}[$__rate_interval])))
        legendFormat: host CPU
  - id: 28
    type: timeseries
    title: Host memory used (apps)
    description: Excludes reclaimable ZFS ARC.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 63 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - node:memory_available_with_arc_bytes{host="$host"} / node_memory_MemTotal_bytes{host="$host"})
        legendFormat: memory
  - id: 29
    type: timeseries
    title: Process network
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 71 }
    fieldConfig:
      defaults:
        unit: bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 8 * rate(process_network_receive_bytes_total{job="gotosocial",host="$host"}[$__rate_interval])
        legendFormat: rx
      - refId: B
        expr: 8 * rate(process_network_transmit_bytes_total{job="gotosocial",host="$host"}[$__rate_interval])
        legendFormat: tx
  - id: 30
    type: timeseries
    title: Disk throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 71 }
    fieldConfig:
      defaults:
        unit: Bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(node_disk_written_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: written
      - refId: B
        expr: sum(rate(node_disk_read_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: read
  - id: 31
    type: row
    title: Storage
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 79 }
    panels: []
  - id: 32
    type: timeseries
    title: Dataset usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 80 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"}
        legendFormat: used
      - refId: B
        expr: zfs_dataset_referenced_bytes{host="$host",name="$dataset"}
        legendFormat: referenced
  - id: 33
    type: timeseries
    title: Dataset growth (per day)
    description: Slope of the dataset's own data over the last 6h, extrapolated to a day.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 80 }
    fieldConfig:
      defaults:
        unit: bytes
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
