        legendFormat: growth
  - id: 34
    type: stat
    title: Compression
    description: Physical used divided by logical used; below 1 means ZFS is compressing the dataset.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 8, x: 0, y: 88 }
    fieldConfig:
      defaults:
        unit: ratio
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"} / zfs_dataset_logical_used_bytes{host="$host",name="$dataset"}
