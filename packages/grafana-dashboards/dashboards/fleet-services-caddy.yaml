title: Fleet / Services / Caddy
uid: fleet-services-caddy
tags: [Fleet, Caddy, Prometheus]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
panels:
  - id: 1
    type: stat
    title: Requests
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: reqps
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(caddy_http_requests_total{exported_host!=""}[$__rate_interval]))
  - id: 2
    type: stat
    title: 5xx
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
    fieldConfig:
      defaults:
        unit: reqps
        decimals: 3
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.1 }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(caddy_http_request_duration_seconds_count{code=~"5..",exported_host!=""}[$__rate_interval]))
  - id: 3
    type: stat
    title: p95 latency
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 8, y: 0 }
    fieldConfig:
      defaults:
        unit: s
        decimals: 3
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.5 }
            - { color: red, value: 2 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: histogram_quantile(0.95, sum by (le) (rate(caddy_http_request_duration_seconds_bucket{code!="101",exported_host!=""}[$__rate_interval])))
  - id: 4
    type: stat
    title: In flight
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 12, y: 0 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(caddy_http_requests_in_flight{exported_host!=""})
  - id: 5
    type: stat
    title: Proxy errors
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 16, y: 0 }
    fieldConfig:
      defaults:
        unit: ops
        decimals: 3
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.1 }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(caddy_http_request_errors_total{exported_host!=""}[$__rate_interval]))
  - id: 6
    type: stat
    title: Unhealthy upstreams
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 20, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(caddy_reverse_proxy_upstreams_healthy{host!=""} == 0) or vector(0)
  - id: 7
    type: stat
    title: Hosts
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(up{job="caddy",host!=""} == 1)
  - id: 8
    type: stat
    title: Vhosts
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 6 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(count by (exported_host) (caddy_http_requests_total{exported_host!=""}))
  - id: 9
    type: stat
    title: Inbound
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 6 }
    fieldConfig:
      defaults:
        unit: Bps
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(caddy_http_request_size_bytes_sum{exported_host!=""}[$__rate_interval]))
  - id: 10
    type: stat
    title: Outbound
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 6 }
    fieldConfig:
      defaults:
        unit: Bps
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(caddy_http_response_size_bytes_sum{exported_host!=""}[$__rate_interval]))
  - id: 11
    type: row
    title: Vhosts
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: timeseries
    title: Requests by vhost
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: reqps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: table, placement: bottom, showLegend: true, calcs: [mean, max] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: topk(10, sum by (exported_host) (rate(caddy_http_requests_total{exported_host!=""}[$__rate_interval])))
        legendFormat: "{{exported_host}}"
  - id: 13
    type: timeseries
    title: Requests by status
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: reqps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (code) (rate(caddy_http_request_duration_seconds_count{exported_host!=""}[$__rate_interval]))
        legendFormat: "{{code}}"
  - id: 14
    type: timeseries
    title: p95 latency by vhost
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 20 }
    fieldConfig:
      defaults:
        unit: s
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: table, placement: bottom, showLegend: true, calcs: [mean, max] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: histogram_quantile(0.95, sum by (le, exported_host) (rate(caddy_http_request_duration_seconds_bucket{code!="101",exported_host!=""}[$__rate_interval])))
        legendFormat: "{{exported_host}}"
  - id: 15
    type: timeseries
    title: Proxy errors by vhost
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 20 }
    fieldConfig:
      defaults:
        unit: ops
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (exported_host) (rate(caddy_http_request_errors_total{exported_host!=""}[$__rate_interval]))
        legendFormat: "{{exported_host}}"
  - id: 16
    type: row
    title: Hosts
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 28 }
    panels: []
  - id: 17
    type: timeseries
    title: Requests by host
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 29 }
    fieldConfig:
      defaults:
        unit: reqps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 15
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum by (host) (rate(caddy_http_requests_total{exported_host!=""}[$__rate_interval]))
        legendFormat: "{{host}}"
  - id: 18
    type: timeseries
    title: CPU by host
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 29 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{host=~"blahaj|jattelik|skogsduva",mode="idle"}[$__rate_interval])))
        legendFormat: "{{host}}"
  - id: 19
    type: timeseries
    title: Memory by host
    description: Excludes reclaimable ZFS ARC.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 37 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - sum by (host) (node:memory_available_with_arc_bytes{host=~"blahaj|jattelik|skogsduva"}) / sum by (host) (node_memory_MemTotal_bytes{host=~"blahaj|jattelik|skogsduva"}))
        legendFormat: "{{host}}"
  - id: 20
    type: timeseries
    title: Network by host
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 37 }
    fieldConfig:
      defaults:
        unit: bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 8 * sum by (host) (rate(node_network_transmit_bytes_total{host=~"blahaj|jattelik|skogsduva",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: "{{host}} tx"
      - refId: B
        expr: 8 * sum by (host) (rate(node_network_receive_bytes_total{host=~"blahaj|jattelik|skogsduva",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: "{{host}} rx"
  - id: 21
    type: row
    title: Upstreams
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 45 }
    panels: []
  - id: 22
    type: table
    title: Upstream health
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 46 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "1": { text: up, index: 0 }
              "0": { text: down, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: green, value: 1 }
      overrides: []
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            __name__: true
            instance: true
            job: true
            service: true
          renameByName:
            Value: health
      - id: sortBy
        options:
          sort:
            - { field: health, desc: false }
    targets:
      - refId: A
        instant: true
        format: table
        expr: caddy_reverse_proxy_upstreams_healthy{host!=""}
  - id: 23
    type: timeseries
    title: Average request and response size
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 46 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(caddy_http_request_size_bytes_sum{exported_host!=""}[$__rate_interval])) / sum(rate(caddy_http_request_size_bytes_count{exported_host!=""}[$__rate_interval]))
        legendFormat: request
      - refId: B
        expr: sum(rate(caddy_http_response_size_bytes_sum{exported_host!=""}[$__rate_interval])) / sum(rate(caddy_http_response_size_bytes_count{exported_host!=""}[$__rate_interval]))
        legendFormat: response
  - id: 24
    type: row
    title: Service
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 54 }
    panels: []
  - id: 25
    type: stat
    title: Targets up
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 55 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(up{job="caddy",host!=""} == 1)
  - id: 26
    type: stat
    title: Config reload
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 55 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "1": { text: ok, index: 0 }
              "0": { text: failed, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: green, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: min(caddy_config_last_reload_successful{host!=""})
  - id: 27
    type: stat
    title: Reachable upstreams
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 55 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(caddy_reverse_proxy_upstreams_healthy{host!=""} == 1)
  - id: 28
    type: stat
    title: Upstreams
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 55 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(caddy_reverse_proxy_upstreams_healthy{host!=""})
