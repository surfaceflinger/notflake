      - refId: B
        expr: prometheus_tsdb_head_chunks_storage_size_bytes{job="prometheus",host="$host"}
        legendFormat: head chunks
  - id: 19
    type: timeseries
    title: Head lag
    description: How far the newest sample is behind the wall clock.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 37 }
    fieldConfig:
      defaults:
        unit: s
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: clamp_min(time() - prometheus_tsdb_head_max_time{job="prometheus",host="$host"} / 1000, 0)
        legendFormat: lag
  - id: 20
    type: timeseries
    title: Query load
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 45 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
