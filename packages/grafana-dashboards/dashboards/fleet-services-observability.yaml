    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 86 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: none
      graphMode: none
      textMode: value_and_name
      orientation: horizontal
    targets:
      - refId: A
        instant: true
        expr: grafana_stat_totals_dashboard{job="grafana",host="$host"}
        legendFormat: dashboards
      - refId: B
        instant: true
        expr: grafana_stat_totals_datasource{job="grafana",host="$host"}
        legendFormat: datasources
      - refId: C
        instant: true
        expr: grafana_stat_totals_folder{job="grafana",host="$host"}
        legendFormat: folders
      - refId: D
        instant: true
        expr: grafana_stat_totals_alert_rules{job="grafana",host="$host"}
        legendFormat: alert rules
  - id: 33
    type: row
    title: Host
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 94 }
    panels: []
  - id: 34
    type: timeseries
    title: Host CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 95 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{host="$host",mode="idle"}[$__rate_interval])))
        legendFormat: host CPU
  - id: 35
    type: timeseries
    title: Host memory used (apps)
    description: Excludes reclaimable ZFS ARC.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 95 }
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 25
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 100 * (1 - node:memory_available_with_arc_bytes{host="$host"} / node_memory_MemTotal_bytes{host="$host"})
        legendFormat: memory
  - id: 36
    type: timeseries
    title: Disk throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 103 }
    fieldConfig:
      defaults:
        unit: Bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: sum(rate(node_disk_written_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: written
      - refId: B
        expr: sum(rate(node_disk_read_bytes_total{host="$host",device!~"^(sr|loop|ram|zram|dm-|md)"}[$__rate_interval]))
        legendFormat: read
  - id: 37
    type: timeseries
    title: Host throughput
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 103 }
    fieldConfig:
      defaults:
        unit: bps
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 20
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: 8 * sum(rate(node_network_receive_bytes_total{host="$host",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: rx
      - refId: B
        expr: 8 * sum(rate(node_network_transmit_bytes_total{host="$host",device!~"lo|tailscale0|veth.*|docker.*|br-.*|virbr.*|tap.*|tun.*"}[$__rate_interval]))
        legendFormat: tx
