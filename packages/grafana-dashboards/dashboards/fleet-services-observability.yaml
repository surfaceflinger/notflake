    type: row
    title: Storage
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 111 }
    panels: []
  - id: 39
    type: timeseries
    title: Dataset usage
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 112 }
    fieldConfig:
      defaults:
        unit: bytes
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"}
        legendFormat: used
      - refId: B
        expr: zfs_dataset_referenced_bytes{host="$host",name="$dataset"}
        legendFormat: referenced
  - id: 40
    type: timeseries
    title: Dataset growth (per day)
    description: Slope of the dataset's own data over the last 6h, extrapolated to a day.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 112 }
    fieldConfig:
      defaults:
        unit: bytes
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: deriv(zfs_dataset_referenced_bytes{host="$host",name="$dataset"}[6h]) * 86400
        legendFormat: growth
  - id: 41
    type: stat
    title: Compression
    description: Physical used divided by logical used; below 1 means ZFS is compressing the dataset.
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 8, x: 0, y: 120 }
    fieldConfig:
      defaults:
        unit: ratio
        decimals: 2
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: zfs_dataset_used_bytes{host="$host",name="$dataset"} / zfs_dataset_logical_used_bytes{host="$host",name="$dataset"}
