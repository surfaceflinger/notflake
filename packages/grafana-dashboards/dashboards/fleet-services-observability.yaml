    panels: []
  - id: 16
    type: timeseries
    title: Head series
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 29 }
    fieldConfig:
      defaults:
        unit: short
        min: 0
        custom:
          drawStyle: line
          lineInterpolation: smooth
          lineWidth: 2
          fillOpacity: 10
          gradientMode: opacity
          showPoints: never
      overrides: []
    options:
      legend: { displayMode: list, placement: bottom, showLegend: true, calcs: [] }
      tooltip: { mode: multi, sort: desc }
    targets:
      - refId: A
        expr: prometheus_tsdb_head_series{job="prometheus",host="$host"}
