    targets:
      - refId: A
        expr: histogram_quantile(0.95, sum by (le) (rate(prometheus_engine_query_duration_histogram_seconds_bucket{job="prometheus",host="$host"}[$__rate_interval])))
        legendFormat: p95
  - id: 22
