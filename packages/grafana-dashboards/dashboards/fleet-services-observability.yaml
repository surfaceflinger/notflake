            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: prometheus_tsdb_head_series{job="prometheus",host="$host"}
  - id: 6
    type: stat
    title: Samples/s
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 20, y: 0 }
    fieldConfig:
      defaults:
        unit: cps
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: sum(rate(prometheus_tsdb_head_samples_appended_total{job="prometheus",host="$host"}[$__rate_interval]))
  - id: 7
    type: stat
    title: Prometheus RSS
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 0, y: 6 }
    fieldConfig:
      defaults:
        unit: bytes
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: process_resident_memory_bytes{job="prometheus",host="$host"}
  - id: 8
    type: stat
    title: Prometheus CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 6, y: 6 }
    fieldConfig:
      defaults:
        unit: percent
        decimals: 1
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: rate(process_cpu_seconds_total{job="prometheus",host="$host"}[$__rate_interval]) * 100
  - id: 9
    type: stat
    title: Grafana RSS
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 12, y: 6 }
    fieldConfig:
