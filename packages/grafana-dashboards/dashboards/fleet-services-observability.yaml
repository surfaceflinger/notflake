title: Fleet / Services / Observability
uid: fleet-services-observability
tags: [Fleet, Observability, Prometheus, Grafana]
timezone: browser
refresh: 30s
time:
  from: now-6h
  to: now
schemaVersion: 39
graphTooltip: 1
editable: true
links:
  - title: Overview
    url: /d/fleet-views-overview
    type: link
    icon: dashboard
  - title: Host detail
    url: /d/fleet-views-host
    type: link
    icon: dashboard
  - title: Storage
    url: /d/fleet-views-storage
    type: link
    icon: dashboard
templating:
  list:
    - name: host
      label: Host
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(up{job="prometheus"}, host)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
    - name: dataset
      label: Dataset
      type: query
      datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
      query:
        query: label_values(zfs_dataset_used_bytes{host="$host",name=~".*prometheus.*"}, name)
        refId: PrometheusVariableQueryEditor-VariableQuery
      refresh: 1
      sort: 1
      hide: 0
      multi: false
      includeAll: false
panels:
  - id: 1
    type: stat
    title: Prometheus
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 0, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "1": { text: ready, index: 0 }
              "0": { text: not ready, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: green, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: prometheus_ready{job="prometheus",host="$host"}
  - id: 2
    type: stat
    title: Grafana
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 4, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        mappings:
          - type: value
            options:
              "1": { text: up, index: 0 }
              "0": { text: down, index: 1 }
        thresholds:
          mode: absolute
          steps:
            - { color: red, value: null }
            - { color: green, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: up{job="grafana",host="$host"}
  - id: 3
    type: stat
    title: Targets up
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 8, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(up == 1)
  - id: 4
    type: stat
    title: Targets down
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 12, y: 0 }
    fieldConfig:
      defaults:
        unit: none
        decimals: 0
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: red, value: 1 }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: background
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: count(up == 0) or vector(0)
  - id: 5
    type: stat
    title: Head series
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 6, w: 4, x: 16, y: 0 }
    fieldConfig:
      defaults:
        unit: short
        decimals: 0
        thresholds:
          mode: absolute
