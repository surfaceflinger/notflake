        thresholds:
          mode: absolute
          steps:
            - { color: blue, value: null }
      overrides: []
    options:
      reduceOptions: { calcs: [lastNotNull], fields: "", values: false }
      colorMode: value
      graphMode: none
      textMode: value
    targets:
      - refId: A
        instant: true
        expr: grafana_process_resident_memory_bytes{job="grafana",host="$host"}
  - id: 10
    type: stat
    title: Grafana CPU
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 5, w: 6, x: 18, y: 6 }
