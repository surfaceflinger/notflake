        expr: rate(grafana_process_cpu_seconds_total{job="grafana",host="$host"}[$__rate_interval]) * 100
  - id: 11
    type: row
    title: Scrape
    collapsed: false
    gridPos: { h: 1, w: 24, x: 0, y: 11 }
    panels: []
  - id: 12
    type: table
    title: Slowest targets (now)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 0, y: 12 }
    fieldConfig:
      defaults:
        unit: s
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
            - { color: orange, value: 0.5 }
      overrides: []
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            __name__: true
            instance: true
            role: true
          renameByName:
            Value: duration
      - id: sortBy
        options:
          sort:
            - { field: duration, desc: true }
    targets:
      - refId: A
        instant: true
        format: table
        expr: topk(8, scrape_duration_seconds and up == 1)
  - id: 13
    type: table
    title: Samples per target (now)
    datasource: { type: prometheus, uid: "${DS_PROMETHEUS}" }
    gridPos: { h: 8, w: 12, x: 12, y: 12 }
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
            - { color: green, value: null }
      overrides: []
    options:
      showHeader: true
      cellHeight: sm
    transformations:
      - id: organize
